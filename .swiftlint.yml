excluded:
  - .build
  - build
  - dist
  - .venv

# Preserve the existing code style. Warnings retain the normal thresholds;
# errors are reserved for outliers that deserve immediate attention.
line_length:
  warning: 120
  error: 1000
identifier_name:
  min_length:
    warning: 1
    error: 1
type_body_length:
  warning: 250
  error: 1000
