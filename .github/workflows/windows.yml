# Cornetta per Windows: compila, prova, impacchetta con Velopack.
# - push su un ramo che tocca windows/: build, test, selftest (anche col veleno), pannelli, avvio dell'app, pacchetto di prova (versione 0.0.<run>)
# - tag win-v0.3.0: stessa cosa con la versione 0.3.0, pronta da pubblicare
# - avvio a mano (workflow_dispatch) con la versione scelta
# - pull request: build, test e prove dell'app, ma niente pacchetto né artifact da pubblicare.
#   Le release GitHub vengono create manualmente dopo la run verde, non da questo workflow.
# Gli artifact contengono CornettaSetup.exe e i file necessari all'installer.
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["win-v*"]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versione da impacchettare (es. 0.3.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  VPK_VERSION: "1.2.161"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json
          dotnet-version: "8.0.x"

      - name: Versione
        id: version
        run: |
          $ref = "${{ github.ref }}"
          $inputVersion = "${{ inputs.version }}"
          if ($ref -like "refs/tags/win-v*") { $v = $ref.Substring("refs/tags/win-v".Length) }
          elseif ($inputVersion) { $v = $inputVersion }
          else { $v = "0.0.${{ github.run_number }}" }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Versione non valida: $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versione: $v"

      - name: Restore
        run: dotnet restore Cornetta.Windows.sln

      - name: Build
        run: dotnet build Cornetta.Windows.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }} -p:CornettaBuild=${{ github.run_number }}

      - name: Test (net10.0 e net48)
        run: dotnet test Cornetta.Windows.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Prepara la cartella dell'app
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item src/Cornetta.App/bin/Release/net48/* publish/ -Recurse
          Get-ChildItem publish | Format-Table Name, Length

      - name: Smoke test (--selftest)
        run: |
          $out = Join-Path $PWD "selftest-stdout.txt"
          $err = Join-Path $PWD "selftest-stderr.txt"
          $report = Join-Path $PWD "selftest-report.txt"
          $p = Start-Process -FilePath (Resolve-Path publish/Cornetta.exe) -ArgumentList "--selftest", "--selftest-out", "`"$report`"" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          Write-Host "--- rapporto ---"
          if (Test-Path $report) { Get-Content $report } else { Get-Content $out }
          if ((Get-Item $err).Length -gt 0) { Write-Host "--- stderr ---"; Get-Content $err }
          $log = Join-Path $env:LOCALAPPDATA "Cornetta/cornetta.log"
          if (Test-Path $log) { Write-Host "--- cornetta.log ---"; Get-Content $log }
          Write-Host "Codice di uscita: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Il selftest sa fallire (veleno)
        run: |
          # Senza l'audio di sistema sintetico il selftest deve uscire con 1 e dire perché.
          $report = Join-Path $PWD "selftest-veleno.txt"
          $p = Start-Process -FilePath (Resolve-Path publish/Cornetta.exe) -ArgumentList "--selftest", "--selftest-poison", "--selftest-out", "`"$report`"" `
                 -Wait -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $PWD "veleno-stdout.txt")
          Get-Content $report
          if ($p.ExitCode -ne 1) { throw "Col veleno il selftest doveva uscire con 1, invece: $($p.ExitCode)" }
          if (-not (Select-String -Path $report -SimpleMatch "L'audio di sistema non è finito nel punto giusto" -Encoding utf8)) { throw "Il selftest è fallito per il motivo sbagliato" }
          Write-Host "Veleno riconosciuto: il selftest fallisce col motivo atteso."

      - name: Disegna i pannelli (--render-ui)
        run: |
          $dir = Join-Path $PWD "ui"
          $p = Start-Process -FilePath (Resolve-Path publish/Cornetta.exe) -ArgumentList "--render-ui", "`"$dir`"" -Wait -PassThru -NoNewWindow
          Get-ChildItem $dir | Format-Table Name, Length
          exit $p.ExitCode

      - name: L'app si avvia (--smoke-tray)
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/Cornetta.exe) -ArgumentList "--smoke-tray" -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput smoke-stdout.txt -RedirectStandardError smoke-stderr.txt
          Get-Content smoke-stdout.txt, smoke-stderr.txt
          Write-Host "Codice di uscita: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Installa vpk
        if: github.event_name != 'pull_request'
        run: dotnet tool install -g vpk --version $env:VPK_VERSION

      - name: Impacchetta (vpk pack)
        if: github.event_name != 'pull_request'
        run: |
          $v = "${{ steps.version.outputs.version }}"
          vpk pack `
            --packId Cornetta `
            --packVersion $v `
            --packDir publish `
            --mainExe Cornetta.exe `
            --packTitle Cornetta `
            --packAuthors VVG-web `
            --icon src/Cornetta.App/Assets/cornetta.ico `
            --framework net48 `
            --runtime win-x86 `
            --noPortable `
            --outputDir releases
          $setup = Get-ChildItem releases -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "vpk non ha prodotto Setup.exe" }
          Move-Item $setup.FullName releases/CornettaSetup.exe -Force
          # Solo i file di questa versione e il feed: i pacchetti vecchi scaricati per i delta restano sul server.
          New-Item -ItemType Directory -Force upload | Out-Null
          Copy-Item releases/CornettaSetup.exe, releases/releases.win.json upload/
          Copy-Item releases/assets.win.json upload/ -ErrorAction SilentlyContinue
          Copy-Item releases/RELEASES upload/ -ErrorAction SilentlyContinue
          Get-ChildItem releases -Filter "Cornetta-$v-*.nupkg" | Copy-Item -Destination upload/
          Get-ChildItem upload | Format-Table Name, Length

      - name: Prova l'installer (installazione silenziosa per utente)
        if: github.event_name != 'pull_request'
        run: |
          $p = Start-Process -FilePath (Resolve-Path upload/CornettaSetup.exe) -ArgumentList "--silent" -Wait -PassThru
          Write-Host "Setup: codice $($p.ExitCode)"
          Start-Sleep -Seconds 5
          $root = Join-Path $env:LOCALAPPDATA "Cornetta"
          $exe = Join-Path $root "current/Cornetta.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName; throw "Cornetta.exe non installato in $exe" }
          Get-ChildItem $root | Format-Table Name, Length
          $report = Join-Path $PWD "selftest-installed.txt"
          $q = Start-Process -FilePath $exe -ArgumentList "--selftest", "--selftest-out", "`"$report`"" -Wait -PassThru -NoNewWindow
          Get-Content $report
          Get-Process Cornetta -ErrorAction SilentlyContinue | Stop-Process -Force
          exit $q.ExitCode

      - name: Carica gli artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cornetta-windows-${{ steps.version.outputs.version }}
          path: |
            windows/upload/
            windows/selftest-*.txt
          if-no-files-found: warn

      - name: Carica le immagini dei pannelli
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cornetta-windows-ui-${{ steps.version.outputs.version }}
          path: windows/ui/
          if-no-files-found: warn
