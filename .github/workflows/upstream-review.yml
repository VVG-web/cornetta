name: Upstream review

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "upstream-review"
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/stellakamikaze/cornetta.git
          git fetch --no-tags upstream master

      - name: Build advisory report
        run: python3 scripts/upstream-review.py --upstream-ref upstream/master > upstream-review.md

      - name: Publish report in the Actions summary
        run: |
          cat upstream-review.md >> "$GITHUB_STEP_SUMMARY"
          echo "The full report is also attached as an artifact."

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-review
          path: upstream-review.md
          if-no-files-found: error
